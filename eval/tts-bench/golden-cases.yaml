version: "1.0"

suite:
  name: "TTS Golden Suite"
  language: "vi-VN"
  description: >
    Golden suite phục vụ QA TTS cho AI Callbot MVP.
    Scope ưu tiên Verify Identity, Confirm Attendance và No Answer.
  total_cases: 40

scoring:
  zero_tolerance:
    enabled: true
    description: >
      Nếu TTS đọc sai critical business content như ngày, giờ,
      khoa/phòng khám, phủ định hoặc thông tin quan trọng thì case FAIL
      dù giọng nói tự nhiên.

  mos:
    enabled: true
    scale: "1-5"
    dimensions:
      - naturalness
      - intelligibility
      - pacing
      - pronunciation

  technical_check:
    enabled: true
    description: >
      Kiểm file sinh thành công, không silent bất thường,
      không clipping nghiêm trọng và thời lượng hợp lý.

cases:

  # ============================================================
  # A. VERIFY IDENTITY — OPEN QUESTIONS
  # 8 cases
  # ============================================================

  - id: TTS_ID_01
    category: identity_prompt
    text: "Dạ, anh chị vui lòng cho em xin họ và tên đầy đủ."
    critical_items:
      - type: intent
        value: "họ và tên đầy đủ"
    zero_tolerance: true

  - id: TTS_ID_02
    category: identity_prompt
    text: "Anh chị vui lòng cho em biết ngày tháng năm sinh."
    critical_items:
