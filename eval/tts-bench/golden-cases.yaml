    critical_items:
      - type: intent
        value: "ngày tháng năm sinh"
    zero_tolerance: true

  - id: TTS_ID_05
    category: identity_prompt
    text: "Em xin lỗi, em chưa nghe rõ tên của anh chị."
    critical_items:
      - type: intent
        value: "tên"
