  # ============================================================
  # B. VERIFY IDENTITY — DATE OF BIRTH
  # 10 cases
  # ============================================================

  - id: STT_DOB_01
    audio: "audio-8k/STT_DOB_01.wav"
    category: identity_dob
    reference: "Ngày 14 tháng 3 năm 1978."
    critical_entities:
      - type: dob
        value: "14 tháng 3 năm 1978"
    critical: true

  - id: STT_DOB_02
    audio: "audio-8k/STT_DOB_02.wav"
    category: identity_dob
    reference: "Mười bốn tháng ba năm một nghìn chín trăm bảy mươi tám."
    critical_entities:
      - type: dob
        value: "14 tháng 3 năm 1978"
    critical: true

  - id: STT_DOB_03
    audio: "audio-8k/STT_DOB_03.wav"
    category: identity_dob
    reference: "Ngày 4 tháng 3 năm 1978."
    critical_entities:
      - type: day
        value: "4"
      - type: month
        value: "3"
      - type: year
        value: "1978"
    critical: true
    notes: "Kiểm tra phân biệt ngày 4 và ngày 14."

  - id: STT_DOB_04
    audio: "audio-8k/STT_DOB_04.wav"
    category: identity_dob
    reference: "Ngày 14 tháng 8 năm 1978."
    critical_entities:
      - type: day
        value: "14"
      - type: month
        value: "8"
      - type: year
        value: "1978"
    critical: true

  - id: STT_DOB_05
    audio: "audio-8k/STT_DOB_05.wav"
    category: identity_dob
    reference: "Ngày 14 tháng 3 năm 1987."
    critical_entities:
      - type: day
        value: "14"
      - type: month
        value: "3"
      - type: year
        value: "1987"
    critical: true
    notes: "Kiểm tra phân biệt 1978 và 1987."

  - id: STT_DOB_06
    audio: "audio-8k/STT_DOB_06.wav"
    category: identity_dob
    reference: "À không, ngày 15 tháng 3 năm 1978."
    critical_entities:
      - type: correction_marker
        value: "À không"
      - type: dob
        value: "15 tháng 3 năm 1978"
    critical: true
    notes: "STT phải giữ được thông tin caller tự sửa."

  - id: STT_DOB_07
    audio: "audio-8k/STT_DOB_07.wav"
    category: identity_dob
    reference: "Hình như ngày 14 tháng 3 năm 1978."
    critical_entities:
      - type: uncertainty_marker
        value: "Hình như"
      - type: dob
        value: "14 tháng 3 năm 1978"
    critical: true
    notes: >
      STT phải giữ được uncertainty marker. Việc chấp nhận hay hỏi lại DOB
      là policy phía sau, không thuộc STT.

  - id: STT_DOB_08
    audio: "audio-8k/STT_DOB_08.wav"
    category: identity_dob
    reference: "Ngày mười bốn tháng ba năm bảy tám."
    critical_entities:
      - type: spoken_dob
        value: "mười bốn tháng ba năm bảy tám"
    critical: true

  - id: STT_DOB_09
    audio: "audio-8k/STT_DOB_09.wav"
    category: identity_dob
    reference: "Ngày 29 tháng 2 năm 2000."
    critical_entities:
      - type: dob
        value: "29 tháng 2 năm 2000"
    critical: true

  - id: STT_DOB_10
    audio: "audio-8k/STT_DOB_10.wav"
    category: identity_dob
    reference: "Ngày 31 tháng 2 năm 1978."
    critical_entities:
      - type: spoken_dob
        value: "31 tháng 2 năm 1978"
    critical: true
    notes: >
      STT phải transcribe đúng câu caller nói, không tự sửa ngày không hợp lệ.
      Validation thuộc DOB parser phía sau.


  # ============================================================
  # C. CONFIRM ATTENDANCE
  # 10 cases
  # ============================================================

  - id: STT_CF_01
    audio: "audio-8k/STT_CF_01.wav"
    category: confirmation
    reference: "Có, tôi đến được."
    expected_semantic: explicit_agree
    critical_entities:
      - type: agreement
        value: "Có"
    critical: true

  - id: STT_CF_02
    audio: "audio-8k/STT_CF_02.wav"
    category: confirmation
    reference: "Vâng, tôi sẽ đến."
    expected_semantic: explicit_agree
    critical_entities:
      - type: agreement
        value: "Vâng"
    critical: true

  - id: STT_CF_03
    audio: "audio-8k/STT_CF_03.wav"
    category: confirmation
    reference: "Được, tôi đến."
    expected_semantic: explicit_agree
    critical_entities:
      - type: agreement
        value: "Được"
    critical: true

  - id: STT_CF_04
    audio: "audio-8k/STT_CF_04.wav"
    category: confirmation
    reference: "Ừ, chắc tôi đến được."
    expected_semantic: uncertain_agree
    critical_entities:
      - type: uncertainty_marker
        value: "chắc"
    critical: true

  - id: STT_CF_05
    audio: "audio-8k/STT_CF_05.wav"
    category: confirmation
    reference: "Để xem đã."
    expected_semantic: unclear
    critical_entities: []
    critical: true
    notes: "Không được biến thành explicit agreement."

  - id: STT_CF_06
    audio: "audio-8k/STT_CF_06.wav"
    category: confirmation
    reference: "Tôi chưa chắc."
    expected_semantic: unclear
    critical_entities:
      - type: uncertainty_marker
        value: "chưa chắc"
    critical: true

  - id: STT_CF_07
    audio: "audio-8k/STT_CF_07.wav"
    category: confirmation
    reference: "Không, tôi không đến được."
    expected_semantic: explicit_disagree
    critical_entities:
      - type: negation
        value: "Không"
      - type: negation
        value: "không đến được"
    critical: true
    notes: "Critical negation case."

  - id: STT_CF_08
    audio: "audio-8k/STT_CF_08.wav"
    category: confirmation
    reference: "Dạ không."
    expected_semantic: explicit_disagree
    critical_entities:
      - type: negation
        value: "không"
    critical: true

  - id: STT_CF_09
    audio: "audio-8k/STT_CF_09.wav"
    category: confirmation
    reference: "Tôi không nói là tôi không đến, tôi vẫn đến."
    expected_semantic: explicit_agree
    critical_entities:
      - type: final_intent
        value: "tôi vẫn đến"
    critical: true
    notes: "Negation trap."

  - id: STT_CF_10
    audio: "audio-8k/STT_CF_10.wav"
    category: confirmation
    reference: "Có, nhưng là 9 giờ sáng đúng không?"
    expected_semantic: agree_with_question
    critical_entities:
      - type: agreement
        value: "Có"
      - type: time
        value: "9 giờ sáng"
    critical: true


  # ============================================================
