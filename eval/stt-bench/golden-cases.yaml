        value: "9 giờ sáng"
    critical: true

  - id: STT_ENT_03
    audio: "audio-8k/STT_ENT_03.wav"
    category: business_entity
    reference: "Khoa Nội tổng quát."
    critical_entities:
      - type: department
        value: "Nội tổng quát"
    critical: true

  - id: STT_ENT_04
    audio: "audio-8k/STT_ENT_04.wav"
    category: business_entity
    reference: "Lịch khám Nội tổng quát ngày 14 tháng 10 lúc 9 giờ sáng."
    critical_entities:
      - type: department
        value: "Nội tổng quát"
      - type: date
        value: "14 tháng 10"
      - type: time
        value: "9 giờ sáng"
    critical: true


  # ============================================================
  # E. SILENCE / VOICEMAIL / LINE SIGNAL
  # 6 cases
  # ============================================================

  - id: STT_SIG_01
    audio: "audio-8k/STT_SIG_01.wav"
    category: silence
    reference: ""
    expected_signal: silence
    should_produce_text: false
    critical: true
    notes: "Khoảng 5 giây im lặng hoàn toàn."

  - id: STT_SIG_02
    audio: "audio-8k/STT_SIG_02.wav"
    category: background_noise
    reference: ""
    expected_signal: noise_only
    should_produce_text: false
    critical: true
    notes: >
      Có background noise nhưng không có speech.
      Model không được hallucinate transcript.

  - id: STT_SIG_03
    audio: "audio-8k/STT_SIG_03.wav"
    category: speech_after_silence
    reference: "Alo?"
    expected_signal: speech
    should_produce_text: true
    critical_entities:
      - type: speech
        value: "Alo"
    critical: false
    notes: "Có khoảng 2 giây silence trước khi caller nói Alo."

  - id: STT_SIG_04
    audio: "audio-8k/STT_SIG_04.wav"
    category: voicemail
    reference: "Xin vui lòng để lại lời nhắn sau tiếng bíp."
    expected_signal: voicemail
    should_produce_text: true
    critical_entities:
      - type: voicemail_phrase
        value: "để lại lời nhắn"
    critical: true

  - id: STT_SIG_05
    audio: "audio-8k/STT_SIG_05.wav"
    category: automated_line_message
    reference: "Thuê bao quý khách vừa gọi hiện không liên lạc được."
    expected_signal: no_answer
    should_produce_text: true
    critical_entities:
      - type: line_message
        value: "không liên lạc được"
    critical: true

  - id: STT_SIG_06
    audio: "audio-8k/STT_SIG_06.wav"
    category: line_signal
    reference: ""
    expected_signal: busy_or_ringing
    should_produce_text: false
    critical: true
    notes: >
      Chỉ có busy tone hoặc ringing, không có human speech.
      STT không được hallucinate transcript.