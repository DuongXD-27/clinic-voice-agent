  - id: STT_ID_05
    audio: "audio-8k/STT_ID_05.wav"
    category: identity_name
    reference: "Tôi là Nguyễn Văn A, còn em tôi là Nguyễn Văn B."
    critical_entities:
      - type: caller_name
        value: "Nguyễn Văn A"
      - type: mentioned_person_name
        value: "Nguyễn Văn B"
    critical: true
    notes: >
      STT phải giữ được cả hai tên. Việc xác định Nguyễn Văn A là caller
      thuộc trách nhiệm của Identity Extraction, không phải STT.

  - id: STT_ID_06
    audio: "audio-8k/STT_ID_06.wav"
