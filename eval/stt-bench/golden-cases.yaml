version: "1.0"

suite:
  name: "STT Golden Audio Suite"
  language: "vi-VN"
  description: >
    Golden dataset phục vụ đánh giá STT cho MVP AI Callbot.
    Scope hiện tại gồm Verify Identity, Confirm Attendance và No Answer.
  total_cases: 40

audio_spec:
  sample_rate_hz: 8000
  channels: 1
  format: "wav"
  encoding: "pcm_s16le"

scoring:
  wer:
    enabled: true

  critical_entity_check:
    enabled: true
    description: >
      Các entity nghiệp vụ quan trọng phải được nhận dạng đúng.
      WER thấp không đủ để PASS nếu model làm sai critical entity.

  silence_hallucination_check:
    enabled: true
    description: >
      Audio silence/noise không có speech không được sinh transcript giả.

cases:

  # ============================================================
  # A. VERIFY IDENTITY — FULL NAME
  # 10 cases
  # ============================================================

  - id: STT_ID_01
    audio: "audio-8k/STT_ID_01.wav"
    category: identity_name
    reference: "Tôi là Nguyễn Văn A."
    critical_entities:
      - type: person_name
        value: "Nguyễn Văn A"
    critical: true

  - id: STT_ID_02
    audio: "audio-8k/STT_ID_02.wav"
    category: identity_name
    reference: "Nguyễn Văn A."
    critical_entities:
      - type: person_name
        value: "Nguyễn Văn A"
    critical: true

  - id: STT_ID_03
    audio: "audio-8k/STT_ID_03.wav"
    category: identity_name
    reference: "Dạ, em tên là Trần Thị Mai."
    critical_entities:
      - type: person_name
        value: "Trần Thị Mai"
