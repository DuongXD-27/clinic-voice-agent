[project]
name = "vinmec-callbot"
version = "0.1.0"
description = "Callbot Vinmec - AIHR-PC-001"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.2,<7",
]

[project.optional-dependencies]
speech = [
    "numpy>=1.26",
    "google-genai>=1.0",
]
speech-local = [
    "numpy>=1.26",
    "transformers>=4.44",
    "torch>=2.3",
]
llm = [
    "google-genai>=1.0",
]
dev = [
    "fakeredis>=2.26,<3",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callbot", "src/llm"]

[tool.hatch.build]
# Cài -e: đưa src/ (không phải gốc repo) vào sys.path, để `import callbot` chạy được ngoài pytest
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
# Không thêm src/ vào sys.path: test chạy trên package đã cài (`pip install -e ".[dev]"`), giống Docker
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
# Khớp .gitattributes (*.py eol=lf)
line-ending = "lf"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear
select = ["E", "W", "F", "I", "B"]
# Chuỗi/comment tiếng Việt dài — để formatter lo độ dài dòng
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["callbot", "llm"]
