[project]
name = "vinmec-callbot"
version = "0.1.0"
description = "Callbot Vinmec - AIHR-PC-001"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # TTS ElevenLabs qua WebSocket stream-input (inference/tts/providers/elevenlabs.py); uvicorn[standard] cũng kéo gói này
    "websockets>=13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.2,<7",
]

[project.optional-dependencies]
speech = [
    "numpy>=1.26",
    "soxr>=0.4",
    "google-genai>=1.0",
    # Transcript Evidence (docs/reference/livekit-architecture.md §5.4): so sánh similarity
    # giữa các partial transcript liên tiếp để phát hiện dao động/hallucination.
    "rapidfuzz>=3.0",
]
speech-local = [
    "numpy>=1.26",
    "transformers>=4.44",
    "torch>=2.3",
]
speech-zipformer = [
    "numpy>=1.26",
    "sherpa-onnx>=1.13",
    "soundfile>=0.12",
    "openai>=1.0",
]
vad-webrtc = [
    # Fork "webrtcvad" gốc trên PyPI phụ thuộc pkg_resources (setuptools) đã bị gỡ khỏi
    # bản setuptools mới — dùng webrtcvad-wheels (cùng C extension, không phụ thuộc đó).
    "webrtcvad-wheels>=2.0.11",
]
vad-silero = [
    # Cùng package sherpa-onnx đã có trong speech-zipformer (sherpa_onnx.VoiceActivityDetector
    # + SileroVadModelConfig) — asset .onnx tải riêng, xem SILERO_VAD_MODEL_PATH trong .env.example.
    "sherpa-onnx>=1.13",
]
llm = [
    "google-genai>=1.0",
]
livekit = [
    "livekit-agents>=1.8",
    "livekit-api>=1.2",
]
dev = [
    "fakeredis>=2.26,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callbot", "src/inference", "src/speech"]

[tool.hatch.build]
# Cài -e: đưa src/ (không phải gốc repo) vào sys.path, để `import callbot` chạy được ngoài pytest
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
# Không thêm src/ vào sys.path: test chạy trên package đã cài (`pip install -e ".[dev]"`), giống Docker
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
# Khớp .gitattributes (*.py eol=lf)
line-ending = "lf"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear
select = ["E", "W", "F", "I", "B"]
# Chuỗi/comment tiếng Việt dài — để formatter lo độ dài dòng
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["callbot", "inference", "speech"]
