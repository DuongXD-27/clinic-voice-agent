# ASR providers — inference.asr.config. Mỗi section ứng với một provider (chọn ở speech.yaml).
# Ghi đè bằng biến môi trường ghi cạnh từng khóa. API key chỉ đặt qua env, không để ở đây.

gemini: # GEMINI_API_KEY
  model: gemini-2.5-flash # GEMINI_ASR_MODEL

# ASR streaming qua Live API; endpoint local, transcript VERBATIM, không sinh lời bot.
gemini_live: # GEMINI_API_KEY
  model: gemini-3.5-transcribe-live # GEMINI_LIVE_ASR_MODEL
  language_code: vi-VN # GEMINI_LIVE_LANGUAGE_CODE
  connect_timeout_s: 10.0 # GEMINI_LIVE_CONNECT_TIMEOUT_S
  final_timeout_s: 3.0 # GEMINI_LIVE_FINAL_TIMEOUT_S
  chunk_ms: 100 # GEMINI_LIVE_CHUNK_MS
  max_turn_speech_ms: 15000 # GEMINI_LIVE_MAX_TURN_SPEECH_MS
  # Audio trước frame đầu tiên được báo là tiếng nói, gửi kèm khi mở đoạn (xem zipformer).
  pre_speech_ms: 300 # GEMINI_LIVE_PRE_SPEECH_MS
  # Chọn Gemini thì chỉ dùng Gemini, không decode lại bằng model khác: đoạn lỗi (hết hạn chờ
  # final, mất kết nối, hết credit) chỉ mất đoạn đó; nhiều đoạn lỗi liên tiếp thì dừng luồng STT.

phowhisper:
  model: vinai/PhoWhisper-large # PHOWHISPER_MODEL

# Streaming thật qua WebSocket (ELEVENLABS_API_KEY) — xem src/inference/asr/providers/elevenlabs_realtime.py
elevenlabs_realtime:
  model: scribe_v2_realtime # ELEVENLABS_REALTIME_STT_MODEL
  # ISO-639-3 tiếng Việt
  language_code: vie # ELEVENLABS_STT_LANGUAGE_CODE
  base_url: wss://api.elevenlabs.io # ELEVENLABS_REALTIME_WS_URL
  # Chỉ ảnh hưởng ngưỡng partial_transcript nội bộ; commit turn là việc của TurnController.
  vad_silence_threshold_secs: 1.5 # ELEVENLABS_REALTIME_VAD_SILENCE_SECS
  # Tối đa 50 keyterm, ngăn cách dấu phẩy. Có thể tăng chi phí STT.
  keyterms: "" # ELEVENLABS_STT_KEYTERMS

# Asset tải tay (bị .gitignore) hoặc Dockerfile tự tải lúc build image (huggingface_hub, vào
# /app/models/zipformer — thư mục TÊN zipformer, nội dung là model gipformer1.5, không đổi tên
# thư mục production). gipformer1.5 (g-group-ai-lab/gipformer1.5-68M-rnnt) thay
# csukuangfj/sherpa-onnx-zipformer-vi-int8-2025-04-20 từ 23/09/2026 (commit ccd1163): model cũ
# hallucinate nặng trên audio LiveKit thật, gipformer1.5 decode đúng trên chính những audio đó
# (đã kiểm chứng thực nghiệm). Đồng bộ default ở đây (28/09) để chạy không qua Docker cũng dùng
# đúng model và đúng tên thư mục assets/zipformer/ như Docker — trước đó lệch cả model lẫn tên
# thư mục, gây rủi ro chạy nhầm model cũ trên máy khác/CI.
zipformer:
  model: g-group-ai-lab/gipformer1.5-68M-rnnt # ZIPFORMER_MODEL
  encoder_path: src/inference/asr/providers/assets/zipformer/encoder.int8.onnx # ZIPFORMER_ENCODER_PATH
  decoder_path: src/inference/asr/providers/assets/zipformer/decoder.onnx # ZIPFORMER_DECODER_PATH
  joiner_path: src/inference/asr/providers/assets/zipformer/joiner.int8.onnx # ZIPFORMER_JOINER_PATH
  tokens_path: src/inference/asr/providers/assets/zipformer/tokens.txt # ZIPFORMER_TOKENS_PATH
  num_threads: 2 # ZIPFORMER_NUM_THREADS
  # Không decode buffer speech ngắn hơn ngưỡng này — chống hallucinate từ "à"/"ờm".
  min_decode_ms: 400 # ZIPFORMER_MIN_DECODE_MS
  # Flush cưỡng bức khi speech liên tục vượt ngưỡng — chống memory leak khi VAD không báo
  # speech_end (docs/reference/livekit-architecture.md §5.5).
  max_turn_speech_ms: 15000 # ZIPFORMER_MAX_TURN_SPEECH_MS
  # Hotword theo lượt (callbot/engine/asr_hints.py, kế hoạch asr-rui-ro/ke-hoach-hotword-theo-state.md):
  # bật thì decode bằng modified_beam_search, final câu trả lời được bias theo câu bot vừa hỏi.
  # Bật sau đo 12/10 (scripts/hotword_eval.py, golden 40 câu): beam không hint không tụt (18/40 như
  # greedy), hint sửa 1/8 câu tên, câu gài không bị kéo thêm; 1.5 = 2.0 nên giữ 1.5. Docker xuất
  # bpe.vocab từ bpe.model.
  hotwords_enabled: true # ZIPFORMER_HOTWORDS_ENABLED
  bpe_vocab_path: src/inference/asr/providers/assets/zipformer/bpe.vocab # ZIPFORMER_BPE_VOCAB_PATH
  hotwords_score: 1.5 # ZIPFORMER_HOTWORDS_SCORE
  max_active_paths: 4 # ZIPFORMER_MAX_ACTIVE_PATHS
  # Giãn nhịp decode partial cho câu dài: max(300 ms, tỉ lệ x độ dài buffer). 0 = tắt.
  # Chỉ bật sau khi đo CPU trên máy production.
  partial_interval_ratio: 0.0 # ZIPFORMER_PARTIAL_INTERVAL_RATIO
  # Audio giữ lại trước frame đầu tiên được báo là tiếng nói (bù độ trễ nhận ra đầu câu của
  # Silero, mặc định 0,25 s).
  # Đo 06/10 (eval/noise-bench): 1000 ms giảm WER có nhãn của bộ golden (8 kHz điện thoại) ở
  # mọi mức nhiễu văn phòng (vd. office@8 0,193 -> 0,130) nhưng trên bộ web (LiveKit 16 kHz,
  # đường production hiện tại) trái chiều — sửa 5 câu, hỏng 5 câu ("ĐÚNG KHÔNG" -> "ĐÚNG"),
  # 600 ms cũng vậy. Giữ 300 cho web; ứng viên cho profile điện thoại khi có SIP.
  pre_speech_ms: 300 # ZIPFORMER_PRE_SPEECH_MS
  # Final chỉ decode tới frame cuối còn là giọng (Silero gắn cờ, hoặc to trong vòng 25 dB đỉnh câu)
  # + chừng này ms; null = cả ~1,1 s im lặng đuôi như trước 08/10. Đuôi im lặng dài làm câu ngắn
  # đổi chữ ("BÂY GIỜ" -> "ĐƯỢC", "OK" -> "Ừ/ĐÂY"). 150 ms làm thêm chữ thừa sau tiếng động cuối.
  final_tail_ms: 300 # ZIPFORMER_FINAL_TAIL_MS
  # Ngoài pre_speech_ms, lần ngược tối đa chừng này ms tới chỗ năng lượng thật sự bắt đầu
  # (Silero báo trễ p50 360 ms, p90 720 ms so với điểm năng lượng trên 870 câu thật). null = tắt.
  # TẮT 08/10: noise-bench bộ web mất lượt (sạch 0 -> 2, office@3 7 -> 10) dù golden-web tốt hơn
  # (WER 0,120 -> 0,107). Lỗi "mất HỌ VÀ TÊN" ở cuộc gọi thật là do lọc echo, không phải pre-roll.
  onset_lookback_ms: null # ZIPFORMER_ONSET_LOOKBACK_MS
