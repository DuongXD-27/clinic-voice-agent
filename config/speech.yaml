# Voice pipeline — speech.settings.SpeechSettings.
# Ghi đè từng khóa bằng biến môi trường cùng tên viết hoa (vd. VAD_PROVIDER=webrtc).
# Tần số mẫu: HTTP giữ tần số gốc của clip; LiveKit dùng input_sample_rate trong livekit.yaml.

# Cấu hình từng provider ở asr.yaml.
#   zipformer: chạy được cả HTTP lẫn LiveKit (mặc định).
#   elevenlabs_realtime: chỉ LiveKit (không có transcribe() cho clip HTTP).
#   gemini, phowhisper: chỉ HTTP (không có stream() cho LiveKit).
asr_provider: zipformer
# openai | elevenlabs | vbee — cấu hình từng provider ở tts.yaml
tts_provider: vbee
# Provider dự phòng khi provider chính lỗi/chậm, vd. tts_provider=vbee + elevenlabs.
# null = không fallback. Cần đủ key của cả hai provider, thiếu thì app không khởi động.
tts_fallback_provider: null

# --- VAD (chỉ đường LiveKit; đường HTTP decode cả clip, không dùng VAD) ---
# energy | webrtc | silero — một bộ phân loại, dùng chung cho VAD chính và bộ chốt câu của ASR.
# Đổi sang silero 28/09/2026 theo quyết định owner (docs/evidence/livekit-audio-plan-execution-
# 2026-09-28.md §5.2): tốt hơn rõ cho câu dài/latency dưới nhiễu (false_turns 11→0, latency
# 3,96s→0,7s), NHƯNG tệ hơn rõ cho câu ngắn dưới nhiễu văn phòng (no_turn 13→26/38) — rủi ro đã
# biết, chấp nhận có chủ đích.
vad_provider: silero
vad_rms_threshold: 500.0       # chỉ cho energy
vad_webrtc_aggressiveness: 2   # chỉ cho webrtc
vad_end_silence_ms: 600
# Silero dùng cho vad_provider=silero và LUÔN dùng cho SNR của Turn Validator. Tải:
#   curl -L -o src/speech/asr/vad/assets/silero_vad.onnx \
#     https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
silero_vad_model_path: src/speech/asr/vad/assets/silero_vad.onnx
# Silero giữ "đang nói" thêm chừng này sau khi hết tiếng; cộng với vad_end_silence_ms thành
# thời gian chờ hết câu.
silero_min_silence_ms: 500

# --- Chốt lượt (TurnController, đường LiveKit) ---
# Lượt ngắn hơn ngưỡng này bị coi là tiếng động/backchannel.
turn_min_speech_ms: 250
turn_max_wait_after_vad_end_ms: 300
# ASR còn tồn audio của câu (decode chậm) thì chờ thêm tối đa chừng này trước khi chốt bằng partial.
turn_max_wait_for_asr_ms: 3000
# Lời bắt đầu quá sát lúc bot vừa dứt lời phải dài thêm — chống dư âm/tiếng vọng phòng.
turn_post_bot_guard_ms: 500
# Lượt đã đủ điều kiện chốt (có final) vẫn chờ thêm chừng này; người gọi nói tiếp trong lúc đó
# ("14 tháng 3" … ừm … "năm 1978") thì nối vào cùng lượt thay vì thành hai lượt. Cộng thẳng vào
# độ trễ MỌI lượt. 0 = tắt. Bật 08/10 theo yêu cầu owner để thử trực tiếp — chưa đo trên GipFormer.
turn_merge_window_ms: 700

# Audio giữ trước lúc VAD của ASR nhận ra tiếng nói, đưa kèm vào ASR streaming (Silero bật cờ
# trễ 250-700 ms). null = theo pre_speech_ms của provider trong asr.yaml (300 ms).
asr_pre_speech_ms: null

# Cuộc gọi điện thoại (participant SIP của LiveKit) ghi đè các khoá trên. Chỉ ghi khoá đã đo.
#   asr_pre_speech_ms 1000: đo 07/10 trên kênh điện thoại mô phỏng (noise-bench --channel phone,
#   8 kHz G.711): WER lượt bộ golden sạch 0,147 -> 0,087, office@8 0,413 -> 0,263; sửa "KHÔNG
#   ĐƯỢC" -> "CŨNG ĐƯỢC" ở bộ câu ngắn. Đổi lại thêm lượt "ĐÂY" (1 ở office@3, 2 từ clip "Ừ").
#   Trên web (16 kHz) kết quả trái chiều nên web giữ 300.
#   docs/evidence/stt-phone-echo-speaker-2026-10-07.md
phone_overrides:
  asr_pre_speech_ms: 1000

# --- Câu chỉ có từ đệm ("ừ", "à", "ờ", "dạ"…) ---
# false = gửi engine ("ừ/ờ" là đồng ý, "dạ" hỏi lại, "à/ừm" đang nghĩ); true = bỏ (trước 07/10).
# Từ đệm nói lúc bot đang nói luôn bỏ (tiếng đệm "tôi đang nghe").
# Bật 07/10 theo yêu cầu owner để thử trực tiếp — CHƯA có số đo hợp lệ (bộ short sai nhãn,
# docs/evidence/stt-phone-echo-speaker-2026-10-07.md). Rủi ro đã biết: nhiễu lớn đôi khi bị ASR
# nghe thành "Ừ/À" (7/240 đoạn ~3 s nhiễu văn phòng, kênh điện thoại) = đồng ý giả.
turn_drop_filler_words: false

# --- THỬ NGHIỆM: cổng giọng người gọi (speaker embedding, speech/audio/speaker_gate.py) ---
# off | log (chỉ ghi similarity) | enforce (bỏ lượt dài không giống người gọi). Giọng mẫu = lượt
# dài đầu tiên của cuộc gọi; chỉ xét lượt có >= speaker_gate_min_speech_ms tiếng nói. Đo 07/10
# (giọng mẫu cùng cuộc gọi, đoạn 2 s): EER 7% điện thoại / 0,9% web; ngưỡng 0,2 giữ ~98% câu
# thật. Model: sherpa-onnx speaker-recongition-models, nemo_en_titanet_small.onnx.
# Bật enforce 08/10 theo yêu cầu owner để thử trực tiếp — chưa thử trong cuộc gọi thật.
speaker_gate_mode: "enforce"
speaker_gate_model_path: temp/models/speaker/nemo_en_titanet_small.onnx
speaker_gate_threshold: 0.2
speaker_gate_min_speech_ms: 2000

# --- Turn Validator: lọc lượt ảo giác theo SNR + độ ổn định transcript ---
# Bật 28/09/2026 cùng lúc đổi sang Silero (quyết định owner) — chưa có số đo tách riêng.
turn_validator_enabled: true
turn_validator_min_snr_db: 3.0
# Ngưỡng SNR riêng cho barge-in (InterruptionController). null = tắt kiểm tra; 0.0 nếu bot tự
# ngắt lời vì nghe lại chính nó qua loa/mic.
interruption_min_snr_db: 0.0

# URL công khai để dựng audio_url trả về cho harness. Deploy: PUBLIC_BASE_URL trong .env.
public_base_url: http://localhost:8000
audio_dir: temp/audio
