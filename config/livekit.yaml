# LiveKit (streaming voice qua WebRTC) — callbot.transports.livekit.settings.LiveKitSettings.
# Ghi đè bằng LIVEKIT_<KHÓA VIẾT HOA>, vd. LIVEKIT_FRAME_MS=20.
# LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET chỉ đặt qua env / .env.

# null = dùng ASR_PROVIDER trong speech.yaml/env; override riêng: LIVEKIT_ASR_PROVIDER.
asr_provider: null

# Tiền tố room cho web call — CallBridge dùng room.name làm call_id
room_name_prefix: web-
# Hạn token cho browser (giây)
token_ttl_s: 3600
# Web giữ wideband 16 kHz; phone transport sau này vẫn có thể dùng 8000
input_sample_rate: 16000
# Frame cho VAD/endpointing; WebRTC VAD chỉ nhận 10 | 20 | 30
frame_ms: 30
# Backpressure: 1,5 s đủ hấp thụ jitter ngắn nhưng buộc producer chậm lại nếu inference không kịp
input_queue_ms: 1500
# Hàng đợi riêng của ASR, rộng hơn input_queue_ms nhiều: decode chậm không được chặn VAD/barge-in.
# Cache kết quả phân loại frame (SharedSpeechDetector) được tính theo hai hàng đợi này + pre-roll.
asr_queue_ms: 30000
# Giữ phần đầu câu nói chen lúc bot đang phát, replay vào ASR khi xác nhận barge-in thật
barge_in_preroll_ms: 500
# Queue phát càng dài thì barge-in càng chậm (default LiveKit AudioSource là 1000)
output_queue_ms: 200
# Mỗi process nạp một bản ZipFormer; 1 process idle hợp máy demo 2 vCPU/2 GB
worker_num_idle_processes: 1
# Rỗng = LiveKit tự chia job cho MỌI worker không đặt tên trong cùng project — nhiều người
# (hoặc production) dùng chung project thì cuộc gọi có thể rơi vào worker của người khác.
# Đặt tên riêng (vd. LIVEKIT_AGENT_NAME=viet-local) cho CẢ FastAPI lẫn worker: worker chỉ
# nhận job gọi đúng tên, token cấp cho browser gọi đúng agent đó.
agent_name: ""
# Người dùng im lặng liên tục bao lâu (ms, tính từ lúc bot dứt lời, theo VAD) thì gửi core một
# lượt im lặng (silence_ms > 0) — core tự hỏi lại, 3 lượt liên tiếp thì kết thúc/chuyển máy
# (config/engine.yaml max_silent_turns). 0 = tắt.
silence_timeout_ms: 8000
# THỬ NGHIỆM (docs/evidence/livekit-audio-plan-execution-2026-09-28.md §8): đo offline cho
# thấy Krisp VIVA làm WER tệ hơn kể cả trên audio sạch (0,04 -> 0,11-0,12; mất hẳn 3/42 câu) —
# TẮT theo mặc định (đã thử bật 08/10 rồi tắt lại). Bật tạm để nghe thử qua LiveKit streaming
# thật, cần cài `livekit-plugins-krisp` thủ công.
krisp_noise_suppression_enabled: false
# Trang /ui/livekit: gửi kèm câu bot trích xuất của lượt (câu người gọi, giá trị / span đã đọc, model
# đã đọc) qua data channel — có PII (tên, ngày sinh). Bật cho demo; cuộc gọi thật (SIP,
# production) đặt LIVEKIT_DEMO_DEBUG=false. Tương đương header X-Demo-Debug: 1 của HTTP.
demo_debug: true
