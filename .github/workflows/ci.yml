name: CI

# Chỉ kiểm tra khi mã nguồn, test hoặc cấu hình build/runtime thay đổi.
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callbot
          POSTGRES_PASSWORD: callbot
          POSTGRES_DB: callbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callbot -d callbot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_SESSION_DATABASE_URL: postgresql://callbot:callbot@localhost:5432/callbot
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,speech]"

      - name: Lint, format check and test
        run: make check