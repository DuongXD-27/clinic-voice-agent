name: CI/CD

# PR / push mọi nhánh: chạy test.
# Push lên main (hoặc chạy tay): test → build image lên GHCR → deploy lên EC2.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Test tích hợp session store (F-03) chạy trên PostgreSQL thật, không skip
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callbot
          POSTGRES_PASSWORD: callbot
          POSTGRES_DB: callbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callbot -d callbot"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_SESSION_DATABASE_URL: postgresql://callbot:callbot@localhost:5432/callbot
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # khớp Dockerfile
          cache: pip
      - run: pip install -e ".[dev,speech]"
      - run: make check

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Secrets / variables đặt ở cấp repo (Settings → Secrets and variables → Actions)
    # Không cho 2 lần deploy chồng nhau; lần mới chờ lần cũ xong
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      REMOTE_DIR: /opt/callbot
      SSH_TARGET: ${{ vars.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Cấu hình SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Tạo .env cho server
        env:
          BOT_DOMAIN: ${{ vars.BOT_DOMAIN }}
          CLINIC_MOCK_BASE_URL: ${{ vars.CLINIC_MOCK_BASE_URL }}
          CLINIC_MOCK_API_KEY: ${{ secrets.CLINIC_MOCK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSION_DB_PASSWORD: ${{ secrets.SESSION_DB_PASSWORD }}
        run: |
          : "${SESSION_DB_PASSWORD:?Thiếu secret SESSION_DB_PASSWORD}"
          : "${BOT_DOMAIN:?Thiếu variable BOT_DOMAIN}"
          : "${CLINIC_MOCK_API_KEY:?Thiếu secret CLINIC_MOCK_API_KEY}"
          umask 077
          {
            echo "IMAGE=$IMAGE:$GITHUB_SHA"
            echo "BOT_DOMAIN=$BOT_DOMAIN"
            echo "PUBLIC_BASE_URL=https://$BOT_DOMAIN"
            echo "CLINIC_MOCK_BASE_URL=${CLINIC_MOCK_BASE_URL:-https://clinic-mock.vmec-callbot.tech/v1}"
            echo "CLINIC_MOCK_API_KEY=$CLINIC_MOCK_API_KEY"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "SESSION_DB_PASSWORD=$SESSION_DB_PASSWORD"
          } > deploy.env

      - name: Deploy
        run: |
          ssh "$SSH_TARGET" "mkdir -p $REMOTE_DIR"
          scp docker-compose.prod.yml "$SSH_TARGET:$REMOTE_DIR/docker-compose.yml"
          scp deploy.env "$SSH_TARGET:$REMOTE_DIR/.env"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$SSH_TARGET" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh "$SSH_TARGET" "cd $REMOTE_DIR \
            && docker compose pull \
            && docker compose up -d --remove-orphans \
            && docker logout ghcr.io \
            && docker image prune -f"

      - name: Smoke test
        env:
          BOT_DOMAIN: ${{ vars.BOT_DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://$BOT_DOMAIN/ready" && break
            sleep 5
          done
          curl -fsS "https://$BOT_DOMAIN/ready"
          # Không tái sử dụng call_id: phiên lưu bền, mỗi lần smoke một id riêng
          CALL_ID="ci_smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          curl -fsS -X POST "https://$BOT_DOMAIN/v1/calls" \
            -H "Content-Type: application/json" \
            -d '{"call_id":"'"$CALL_ID"'","direction":"outbound","appointment_id":"apt_00417","caller_number":null,"locale":"vi-VN","mode":"text","max_turns":20}'
