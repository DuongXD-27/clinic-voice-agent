name: Hotword eval

# Đo hotword theo lượt trên GipFormer thật (scripts/hotword_eval.py, bộ golden eval/stt-bench).
# Chạy tay (Actions > Hotword eval) hoặc khi script/provider đổi; không chặn merge. Kết quả in ra
# log job và lưu artifact hotword-eval-<sha>.
on:
  workflow_dispatch:
    inputs:
      scores:
        description: "hotwords_score, cách nhau bởi dấu cách"
        default: "1.5 3.0"
  push:
    paths:
      - "scripts/hotword_eval.py"
      - "scripts/hotword_trace.py"
      - "scripts/name_turn_latency.py"
      - "src/inference/asr/providers/zipformer.py"
      - "src/speech/asr/hotwords.py"
      - "src/inference/asr/providers/transducer_nbest.py"
      - "config/asr.yaml"
      - ".github/workflows/hotword-eval.yml"

permissions:
  contents: read

concurrency:
  group: hotword-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCORES: ${{ inputs.scores || '1.5 3.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[speech,speech-zipformer]" huggingface_hub sentencepiece pyyaml

      - name: Download GipFormer 1.5
        run: |
          python - <<'EOF'
          from huggingface_hub import hf_hub_download
          for f in ["encoder.int8.onnx", "decoder.onnx", "joiner.int8.onnx", "tokens.txt", "bpe.model"]:
              hf_hub_download("g-group-ai-lab/gipformer1.5-68M-rnnt", f,
                              local_dir="src/inference/asr/providers/assets/zipformer")
          EOF

      - name: Run hotword eval
        run: |
          args=""
          for s in $SCORES; do args="$args --score $s"; done
          python scripts/hotword_eval.py $args --out hotword-results

      - name: Trace name cases
        run: python scripts/hotword_trace.py | tee -a hotword-results/trace.md

      - name: Name turn latency
        run: python scripts/name_turn_latency.py | tee -a hotword-results/latency.md

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: hotword-eval-${{ github.sha }}
          path: hotword-results/
          if-no-files-found: ignore
          retention-days: 14
