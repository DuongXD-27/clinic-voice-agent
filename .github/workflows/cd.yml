name: CD

# CI đã lọc path code/runtime. CD chỉ nhận commit main đã qua CI thành công.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    name: Build production image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.BOT_DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      REMOTE_DIR: /opt/callbot
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      BOT_DOMAIN: ${{ vars.BOT_DOMAIN }}
      CLINIC_MOCK_BASE_URL: ${{ vars.CLINIC_MOCK_BASE_URL }}
      CLINIC_MOCK_API_KEY: ${{ secrets.CLINIC_MOCK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NAME_FALLBACK_PROVIDER: ${{ vars.NAME_FALLBACK_PROVIDER || 'none' }}
      NAME_FALLBACK_MODEL: ${{ vars.NAME_FALLBACK_MODEL }}
      NAME_FALLBACK_MAX_TOKENS: ${{ vars.NAME_FALLBACK_MAX_TOKENS }}
      NAME_FALLBACK_TIMEOUT_S: ${{ vars.NAME_FALLBACK_TIMEOUT_S || '3.0' }}
      SESSION_DB_PASSWORD: ${{ secrets.SESSION_DB_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing secret EC2_HOST}"
          : "${EC2_SSH_KEY:?Missing secret EC2_SSH_KEY}"
          : "${SESSION_DB_PASSWORD:?Missing secret SESSION_DB_PASSWORD}"
          : "${BOT_DOMAIN:?Missing variable BOT_DOMAIN}"
          : "${CLINIC_MOCK_API_KEY:?Missing secret CLINIC_MOCK_API_KEY}"
          case "$NAME_FALLBACK_PROVIDER" in
            none) ;;
            openai) : "${OPENAI_API_KEY:?Missing secret OPENAI_API_KEY}" ;;
            gemini) : "${GEMINI_API_KEY:?Missing secret GEMINI_API_KEY}" ;;
            groq) : "${GROQ_API_KEY:?Missing secret GROQ_API_KEY}" ;;
            openrouter) : "${OPENROUTER_API_KEY:?Missing secret OPENROUTER_API_KEY}" ;;
            *) echo "Invalid NAME_FALLBACK_PROVIDER" >&2; exit 1 ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Create production environment file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            echo "IMAGE=$IMAGE:$DEPLOY_SHA"
            echo "BOT_DOMAIN=$BOT_DOMAIN"
            echo "PUBLIC_BASE_URL=https://$BOT_DOMAIN"
            echo "CLINIC_MOCK_BASE_URL=${CLINIC_MOCK_BASE_URL:-https://clinic-mock.vmec-callbot.tech/v1}"
            echo "CLINIC_MOCK_API_KEY=$CLINIC_MOCK_API_KEY"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY"
            echo "NAME_FALLBACK_PROVIDER=$NAME_FALLBACK_PROVIDER"
            echo "NAME_FALLBACK_MODEL=$NAME_FALLBACK_MODEL"
            echo "NAME_FALLBACK_MAX_TOKENS=$NAME_FALLBACK_MAX_TOKENS"
            echo "NAME_FALLBACK_TIMEOUT_S=$NAME_FALLBACK_TIMEOUT_S"
            echo "SESSION_DB_PASSWORD=$SESSION_DB_PASSWORD"
          } > deploy.env

      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="$EC2_USER@$EC2_HOST"
          ssh -o BatchMode=yes "$SSH_TARGET" "install -d -m 700 '$REMOTE_DIR'"
          scp docker-compose.prod.yml "$SSH_TARGET:$REMOTE_DIR/docker-compose.yml.next"
          scp deploy.env "$SSH_TARGET:$REMOTE_DIR/.env.next"
          ssh -o BatchMode=yes "$SSH_TARGET" \
            "chmod 600 '$REMOTE_DIR/.env.next' \
            && mv '$REMOTE_DIR/docker-compose.yml.next' '$REMOTE_DIR/docker-compose.yml' \
            && mv '$REMOTE_DIR/.env.next' '$REMOTE_DIR/.env'"

      - name: Pull and restart services
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="$EC2_USER@$EC2_HOST"
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$SSH_TARGET" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -o BatchMode=yes "$SSH_TARGET" \
            "set -eu; \
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT; \
            cd '$REMOTE_DIR'; \
            docker compose config --quiet; \
            docker compose pull; \
            docker compose up -d --remove-orphans; \
            docker image prune -f"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --connect-timeout 5 "https://$BOT_DOMAIN/ready"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

          CALL_ID="cd_smoke_${DEPLOY_SHA:0:12}_${GITHUB_RUN_ATTEMPT}"
          curl -fsS --connect-timeout 5 -X POST "https://$BOT_DOMAIN/v1/calls" \
            -H "Content-Type: application/json" \
            -d '{"call_id":"'"$CALL_ID"'","direction":"outbound","appointment_id":"apt_00417","caller_number":null,"locale":"vi-VN","mode":"text","max_turns":20}'
