# Chạy trên EC2, do workflow CD (.github/workflows/cd.yml) chép lên /opt/callbot cùng .env.
# Caddy nhận 80/443, tự xin cert Let's Encrypt cho BOT_DOMAIN và chuyển tới bot trong mạng nội bộ.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: callbot
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD:?Cần SESSION_DB_PASSWORD trong .env}
      POSTGRES_DB: callbot
    volumes:
      # Không xoá volume khi deploy: phiên và nhật ký lệnh cần cho đối soát
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callbot -d callbot"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ${IMAGE:?Cần IMAGE trong .env}
    command: ["python", "-m", "callbot.engine.session.postgres.migrate"]
    environment:
      SESSION_DATABASE_URL: postgresql://callbot:${SESSION_DB_PASSWORD}@postgres:5432/callbot
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    image: ${IMAGE:?Cần IMAGE trong .env}
    restart: unless-stopped
    env_file: .env
    environment:
      SESSION_DATABASE_URL: postgresql://callbot:${SESSION_DB_PASSWORD}@postgres:5432/callbot
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      NAME_FALLBACK_PROVIDER: ${NAME_FALLBACK_PROVIDER:-none}
      NAME_FALLBACK_MODEL: ${NAME_FALLBACK_MODEL:-}
      NAME_FALLBACK_MAX_TOKENS: ${NAME_FALLBACK_MAX_TOKENS:-}
      NAME_FALLBACK_TIMEOUT_S: ${NAME_FALLBACK_TIMEOUT_S:-3.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from ${BOT_DOMAIN:?Cần BOT_DOMAIN trong .env} --to bot:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Giữ chứng chỉ qua các lần deploy, tránh chạm rate limit của Let's Encrypt
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  pg_data:
  caddy_data:
  caddy_config:
