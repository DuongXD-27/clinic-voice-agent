# Chạy trên EC2, do workflow CD (.github/workflows/cd.yml) chép lên /opt/callbot.
# .env do người vận hành quản lý (CD chỉ tạo lần đầu); IMAGE nằm ở image.env do CD ghi mỗi lần deploy:
#   docker compose --env-file .env --env-file image.env up -d
# Rollback về bản deploy trước (CD lưu SHA cũ ở image.env.prev; image kéo lại từ GHCR nếu đã bị dọn):
#   cp image.env.prev image.env && docker compose --env-file .env --env-file image.env up -d
# Caddy nhận 80/443, tự xin cert Let's Encrypt cho BOT_DOMAIN và chuyển tới bot trong mạng nội bộ.
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Cần REDIS_PASSWORD trong .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Cần REDIS_PASSWORD trong .env}
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    image: ${IMAGE:?Cần IMAGE trong image.env}
    restart: unless-stopped
    env_file: .env
    # Wav của TTS/demo là dữ liệu tạm (app tự dọn sau SESSION_MAX_AGE_S): để trong RAM có trần,
    # không phình lớp ghi của container giữa các lần deploy.
    tmpfs:
      - /app/audio_cache:size=${AUDIO_CACHE_SIZE:-512m}
    environment:
      # Caddy chạy ở container khác nên IP nguồn không phải loopback. Cho Uvicorn tin
      # X-Forwarded-Proto để request.url_for() sinh URL https:// cho audio demo.
      # Bot không publish port ra host trong production; chỉ Caddy truy cập được service này.
      FORWARDED_ALLOW_IPS: "*"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Cần REDIS_PASSWORD trong .env}@redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Deploy luôn gọi clinic mock thật; cố định ở đây để .env trên server không đổi được sang sim
      CLINIC_BACKEND: mock
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Token LiveKit dispatch đích danh worker này (xem livekit-worker). Rỗng = automatic dispatch.
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-}
      AUDIO_DIR: ${AUDIO_DIR:-/app/audio_cache}
      # /v1/stt (STT_EVAL_ENABLED) cắt đoạn bằng Silero; model chỉ có ở đường dẫn tải lúc build.
      SILERO_VAD_MODEL_PATH: /app/models/silero/silero_vad.onnx
      ZIPFORMER_ENCODER_PATH: /app/models/zipformer/encoder.int8.onnx
      ZIPFORMER_DECODER_PATH: /app/models/zipformer/decoder.onnx
      ZIPFORMER_JOINER_PATH: /app/models/zipformer/joiner.int8.onnx
      ZIPFORMER_TOKENS_PATH: /app/models/zipformer/tokens.txt
      ZIPFORMER_BPE_VOCAB_PATH: /app/models/zipformer/bpe.vocab
    depends_on:
      redis:
        condition: service_healthy

  livekit-worker:
    image: ${IMAGE:?Cần IMAGE trong image.env}
    restart: unless-stopped
    command: ["python", "-m", "callbot.transports.livekit.worker", "start"]
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Cần REDIS_PASSWORD trong .env}@redis:6379/0
      CLINIC_BACKEND: mock
      ASR_PROVIDER: zipformer
      # Bật Gemini Live cho cuộc gọi LiveKit: GitHub variable LIVEKIT_ASR_PROVIDER=gemini_live (CD ghi
      # vào image.env mỗi lần deploy). Rỗng/không đặt = ASR_PROVIDER ở trên (zipformer). Cần
      # GEMINI_API_KEY trong .env.
      LIVEKIT_ASR_PROVIDER: ${LIVEKIT_ASR_PROVIDER:-}
      # Tên riêng (CD ghi vào image.env): chỉ nhận cuộc gọi của bot cùng tên. Rỗng thì worker không
      # tên nào trong project LiveKit (môi trường khác, máy dev) cũng có thể nhận phòng của bot này.
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-}
      # Cố ý không đặt VAD_PROVIDER: env ghi đè config/speech.yaml. Muốn đổi thì đặt trong .env.
      SILERO_VAD_MODEL_PATH: /app/models/silero/silero_vad.onnx
      ZIPFORMER_ENCODER_PATH: /app/models/zipformer/encoder.int8.onnx
      ZIPFORMER_DECODER_PATH: /app/models/zipformer/decoder.onnx
      ZIPFORMER_JOINER_PATH: /app/models/zipformer/joiner.int8.onnx
      ZIPFORMER_TOKENS_PATH: /app/models/zipformer/tokens.txt
      ZIPFORMER_BPE_VOCAB_PATH: /app/models/zipformer/bpe.vocab
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    # BOT_ADDRESS (tuỳ chọn) ghi đè địa chỉ lắng nghe, ví dụ http://<IP> để chạy HTTP thuần không cần domain.
    command: caddy reverse-proxy --from ${BOT_ADDRESS:-${BOT_DOMAIN:?Cần BOT_DOMAIN trong .env}} --to bot:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Giữ chứng chỉ qua các lần deploy, tránh chạm rate limit của Let's Encrypt
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  caddy_data:
  caddy_config:
