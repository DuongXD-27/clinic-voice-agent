services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-callbot}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-callbot}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Clinic: mặc định dùng clinic_mock_sim trong bộ nhớ (không cần mạng/key). Muốn gọi mock đã deploy
  # (clinic-mock.vmec-callbot.tech) thì đặt CLINIC_BACKEND=mock trong .env, kèm CLINIC_MOCK_API_KEY.
  bot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-callbot}@redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-callbot}
      # Local không cần hơn 1 worker. Khi CLINIC_BACKEND=sim, image tự ép 1 dù .env đặt bao nhiêu
      # (sim nằm trong bộ nhớ từng process — xem CMD trong Dockerfile)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      CLINIC_BACKEND: ${CLINIC_BACKEND:-sim}
      CLINIC_SIM_DATASET: ${CLINIC_SIM_DATASET:-listing3}
      CLINIC_SIM_SCENARIO: ${CLINIC_SIM_SCENARIO:-}
      SESSION_IDLE_TTL_S: ${SESSION_IDLE_TTL_S:-1800}
      SESSION_MAX_AGE_S: ${SESSION_MAX_AGE_S:-7200}
      SESSION_TOMBSTONE_TTL_S: ${SESSION_TOMBSTONE_TTL_S:-86400}
      SESSION_MAX_BYTES: ${SESSION_MAX_BYTES:-262144}
      SESSION_LOCK_LEASE_S: ${SESSION_LOCK_LEASE_S:-60}
      NAME_FALLBACK_PROVIDER: ${NAME_FALLBACK_PROVIDER:-none}
      NAME_FALLBACK_MODEL: ${NAME_FALLBACK_MODEL:-}
      NAME_FALLBACK_MAX_TOKENS: ${NAME_FALLBACK_MAX_TOKENS:-}
      NAME_FALLBACK_TIMEOUT_S: ${NAME_FALLBACK_TIMEOUT_S:-3.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # mode=audio (§4.1.2): gipformer1.5 68M self-host qua sherpa-onnx + OpenAI TTS.
      # Đường dẫn model trỏ vào chỗ Dockerfile tải lúc build (/app/models/zipformer),
      # không phải src/... — xem comment trong Dockerfile.
      ASR_PROVIDER: ${ASR_PROVIDER:-zipformer}
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      AUDIO_DIR: ${AUDIO_DIR:-/app/audio_cache}
      ZIPFORMER_ENCODER_PATH: /app/models/zipformer/encoder.int8.onnx
      ZIPFORMER_DECODER_PATH: /app/models/zipformer/decoder.onnx
      ZIPFORMER_JOINER_PATH: /app/models/zipformer/joiner.int8.onnx
      ZIPFORMER_TOKENS_PATH: /app/models/zipformer/tokens.txt
    # host.docker.internal chỉ tự có trên Docker Desktop (Mac/Windows) — trên
    # Docker Linux cần khai báo tay để container gọi ngược ra service chạy
    # trên host (vd. clinic-mock local ở CLINIC_MOCK_BASE_URL trong .env).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  livekit-worker:
    build: .
    command: ["python", "-m", "callbot.transports.livekit.worker", "start"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-callbot}@redis:6379/0
      ASR_PROVIDER: zipformer
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      VAD_PROVIDER: ${VAD_PROVIDER:-webrtc}
      SILERO_VAD_MODEL_PATH: /app/models/silero/silero_vad.onnx
      ZIPFORMER_ENCODER_PATH: /app/models/zipformer/encoder.int8.onnx
      ZIPFORMER_DECODER_PATH: /app/models/zipformer/decoder.onnx
      ZIPFORMER_JOINER_PATH: /app/models/zipformer/joiner.int8.onnx
      ZIPFORMER_TOKENS_PATH: /app/models/zipformer/tokens.txt
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
