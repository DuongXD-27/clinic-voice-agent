services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Cần REDIS_PASSWORD trong .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Cần REDIS_PASSWORD trong .env}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Clinic: mặc định dùng clinic_mock_sim trong bộ nhớ (không cần mạng/key). Muốn gọi mock đã deploy
  # thì đặt CLINIC_BACKEND=mock, CLINIC_MOCK_BASE_URL và CLINIC_MOCK_API_KEY trong .env.
  bot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Cần REDIS_PASSWORD trong .env}@redis:6379/0
      # Local không cần hơn 1 worker. Khi CLINIC_BACKEND=sim, image tự ép 1 dù .env đặt bao nhiêu
      # (sim nằm trong bộ nhớ từng process — xem CMD trong Dockerfile)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      CLINIC_BACKEND: ${CLINIC_BACKEND:-sim}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Giá trị mặc định khác ở config/*.yaml; ở đây chỉ đặt những gì riêng cho container.
      # Model gipformer1.5 trỏ vào chỗ Dockerfile tải lúc build (/app/models/zipformer),
      # không phải src/... — xem comment trong Dockerfile.
      AUDIO_DIR: ${AUDIO_DIR:-/app/audio_cache}
      ZIPFORMER_ENCODER_PATH: /app/models/zipformer/encoder.int8.onnx
      ZIPFORMER_DECODER_PATH: /app/models/zipformer/decoder.onnx
      ZIPFORMER_JOINER_PATH: /app/models/zipformer/joiner.int8.onnx
      ZIPFORMER_TOKENS_PATH: /app/models/zipformer/tokens.txt
      # Trace JSONL (khi TRACE_ENABLED=true) ghi vào volume để trang /ui/observability đọc lại;
      # giữ qua các lần build lại. Dữ liệu đã ẩn danh (tracing/privacy.py).
      TRACE_JSONL_DIR: /app/traces
      OBSERVABILITY_API_ENABLED: ${OBSERVABILITY_API_ENABLED:-true}
    volumes:
      - traces:/app/traces
    # host.docker.internal chỉ tự có trên Docker Desktop (Mac/Windows) — trên
    # Docker Linux cần khai báo tay để container gọi ngược ra service chạy
    # trên host (vd. clinic-mock local ở CLINIC_MOCK_BASE_URL trong .env).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  livekit-worker:
    build: .
    command: ["python", "-m", "callbot.transports.livekit.worker", "start"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Cần REDIS_PASSWORD trong .env}@redis:6379/0
      ASR_PROVIDER: zipformer
      # LIVEKIT_ASR_PROVIDER=gemini_live trong .env: Gemini Live cho cuộc gọi LiveKit; rỗng = zipformer.
      LIVEKIT_ASR_PROVIDER: ${LIVEKIT_ASR_PROVIDER:-}
      # Cố ý không đặt VAD_PROVIDER / SILERO_VAD_VERSION: env ghi đè config/speech.yaml. Muốn đổi thì
      # đặt trong .env. Chỉ đặt đường dẫn model trong image.
      SILERO_VAD_MODEL_PATH: /app/models/silero/silero_vad.onnx
      SILERO_VAD_V6_MODEL_PATH: /app/models/silero/silero_vad_v6.onnx
      ZIPFORMER_ENCODER_PATH: /app/models/zipformer/encoder.int8.onnx
      ZIPFORMER_DECODER_PATH: /app/models/zipformer/decoder.onnx
      ZIPFORMER_JOINER_PATH: /app/models/zipformer/joiner.int8.onnx
      ZIPFORMER_TOKENS_PATH: /app/models/zipformer/tokens.txt
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  traces:
